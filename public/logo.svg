    <path d="M48 12C48 6.477 52.477 2 58 2H76C87.046 2 96 10.954 96 22V56C96 61.523 91.523 66 86 66C80.477 66 76 61.523 76 56V24C76 20.686 73.314 18 70 18H58C52.477 18 48 15.314 48 12Z" fill="url(#arav-green)" />
