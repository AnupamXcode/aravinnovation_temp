<svg viewBox="0 0 520 130" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logo-orange-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="60%" stop-color="#f15e1c" />
      <stop offset="100%" stop-color="#E84A5F" />
    </linearGradient>
  </defs>

  {/* Left Brand Emblem */}
  <g transform="translate(10, 10)">
    {/* Top-Right Green Corner */}
    <path d="M 42 16 H 78 C 84.6 16 90 21.4 90 28 V 62" stroke="#2e936f" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    
    {/* Middle Orange Arrow Bar */}
    <path d="M 18 36 H 60 C 65.5 36 70 40.5 70 46 V 70" stroke="url(#logo-orange-grad)" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    {/* Magenta/Pink Corner */}
    <path d="M 32 54 H 66 C 72.6 54 78 59.4 78 66 V 88" stroke="#e6007a" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

    {/* 3 Dots */}
    <circle cx="32" cy="54" r="6" fill="#e6007a" />
    <circle cx="28" cy="78" r="6" fill="#f15e1c" />
    <circle cx="16" cy="64" r="6" fill="#fab60a" />
  </g>

  {/* Right Wordmark Typography */}
  <g transform="translate(125, 0)">
    <text x="0" y="44" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="40" fill="#f15e1c" letter-spacing="-0.5">Arav</text>
    <text x="0" y="84" font-family="'Plus Jakarta Sans', 'Inter', system-ui, sans-serif" font-weight="900" font-size="40" fill="#f15e1c" letter-spacing="-0.5">Innovations</text>
    <text x="0" y="112" font-family="'Inter', system-ui, sans-serif" font-weight="700" font-size="14" fill="#2e936f" letter-spacing="0.2">Elevating Brands, One Click at a Time.</text>
  </g>
</svg>
